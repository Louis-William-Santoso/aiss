apiVersion: 1

# Sumber data MariaDB — dibuat otomatis saat Grafana pertama kali jalan.
# Nilai $DB_NAME / $DB_USER / $DB_PASS diambil dari environment container
# (lihat variabel environment service grafana di docker-compose.yml).
datasources:
  - name: MariaDB
    uid: mariaDBDS
    type: mysql
    access: proxy
    url: mariadb:3306
    database: $DB_NAME
    user: $DB_USER
    secureJsonData:
      password: $DB_PASS
    jsonData:
      maxOpenConns: 10
      maxIdleConns: 5
      timeout: 10
    isDefault: true
    editable: false
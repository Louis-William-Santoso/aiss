# Satu server block untuk semogasukses.com:
#   "/"          -> landing page (PHP, katalog produk dari MariaDB)
#   "/dashboard" -> dashboard aplikasi (PHP)
#   "/assets/*"  -> file statis (style.css, app.js)
server {
    listen 80;
    server_name semogasukses.com www.semogasukses.com;

    root /var/www/html;
    index index.php;

    charset utf-8;
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers dasar
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Semua request masuk ke front-controller index.php (landing / dashboard)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Blokir file tersembunyi
    location ~ /\. { deny all; }
}